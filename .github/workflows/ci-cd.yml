name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. Stage: Static Gates, Go Security Guard (-race), Audit & Single Build
  # =========================================================================
  build-and-verify:
    name: Build, Verify & Go Guard (Node 22)
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      ORBIT_DATA_DIR: ${{ github.workspace }}/data
      ORBIT_CUSTOM_DIR: ${{ github.workspace }}/data/custom
      UPLOAD_DIR: ${{ github.workspace }}/data/uploads

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: services/security-guard/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Cache Next.js & ESLint caches
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
            .eslintcache
          key: ${{ runner.os }}-build-cache-${{ hashFiles('**/pnpm-lock.yaml', 'next.config.*', 'eslint.config.*') }}
          restore-keys: |
            ${{ runner.os }}-build-cache-

      - name: Cache Gitleaks binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/gitleaks
          key: ${{ runner.os }}-gitleaks-8.24.0

      - name: Gitleaks Security Scan
        run: |
          mkdir -p ~/.cache/gitleaks
          if [ ! -x ~/.cache/gitleaks/gitleaks ]; then
            GITLEAKS_VERSION="8.24.0"
            curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C ~/.cache/gitleaks gitleaks
            chmod +x ~/.cache/gitleaks/gitleaks
          fi
          ~/.cache/gitleaks/gitleaks detect --source . -v --redact --config .gitleaks.toml

      - name: Prepare runtime directories
        run: mkdir -p data/uploads data/custom bin

      - name: Test & Build Go Security Guard (-race) & FIM Scanner
        run: |
          (cd services/security-guard && go test -count=1 -v -race ./... && go build -o ../../bin/security-guard .)
          pnpm build:fim

      - name: Run Preflight & Security Audit
        run: |
          pnpm preflight
          pnpm audit --prod --audit-level=high

      - name: Production Build & Package Prebuilt Artifacts
        run: |
          pnpm build
          test ! -e .next/standalone/data
          tar --exclude='.next/cache' -cf /tmp/orbit-build.tar .next bin/security-guard tools/bin/fim-scanner

      - name: Upload Prebuilt Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orbit-prebuilt
          path: /tmp/orbit-build.tar
          retention-days: 1
          compression-level: 1

  # =========================================================================
  # 2. Stage: Security Regression & WAF E2E (Reuses Prebuilt Artifacts)
  # =========================================================================
  security-e2e:
    name: Security Regression & WAF E2E
    needs: [build-and-verify]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orbit
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'ci_ephemeral_test_pw' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://orbit:${{ secrets.POSTGRES_PASSWORD || 'ci_ephemeral_test_pw' }}@localhost:5432/orbit
      NODE_ENV: test
      PORT: 3000
      ORBIT_DATA_DIR: ${{ github.workspace }}/data
      ORBIT_CUSTOM_DIR: ${{ github.workspace }}/data/custom
      UPLOAD_DIR: ${{ github.workspace }}/data/uploads

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Download Prebuilt Artifacts
        uses: actions/download-artifact@v4
        with:
          name: orbit-prebuilt
          path: /tmp

      - name: Extract Prebuilt Artifacts & Prepare Directories
        run: |
          tar -xf /tmp/orbit-build.tar
          mkdir -p data/uploads data/custom

      - name: Security Regression & WAF Testing
        run: pnpm test:security

  # =========================================================================
  # 3. Stage: Fresh DB Migration & Contract / API Tests (Node 22 & 26)
  # =========================================================================
  fresh-db:
    name: Fresh DB Migration & Contract Tests (Node ${{ matrix.node-version }})
    needs: [build-and-verify]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 26]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orbit
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: ci_ephemeral_fresh_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://orbit:ci_ephemeral_fresh_pw@localhost:5432/orbit
      NODE_ENV: test
      PORT: 3000
      BASE_URL: http://127.0.0.1:3000
      BOOTSTRAP_ADMIN_EMAIL: admin@orbit.local
      BOOTSTRAP_ADMIN_PASSWORD: ci_ephemeral_admin_pw
      BOOTSTRAP_ADMIN_FIRST_NAME: Orbit
      BOOTSTRAP_ADMIN_LAST_NAME: Admin
      ORBIT_DATA_DIR: ${{ github.workspace }}/data
      ORBIT_CUSTOM_DIR: ${{ github.workspace }}/data/custom
      UPLOAD_DIR: ${{ github.workspace }}/data/uploads

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Download Prebuilt Artifacts
        uses: actions/download-artifact@v4
        with:
          name: orbit-prebuilt
          path: /tmp

      - name: Extract Prebuilt Artifacts & Prepare Standalone Runtime
        run: |
          tar -xf /tmp/orbit-build.tar
          mkdir -p data/uploads data/custom .next/standalone/.next
          rm -rf .next/standalone/.next/static .next/standalone/public
          ln -sfn "${{ github.workspace }}/.next/static" .next/standalone/.next/static
          ln -sfn "${{ github.workspace }}/public" .next/standalone/public

      - name: Start Orbit Server
        run: |
          setsid pnpm start </dev/null > /tmp/orbit-fresh-db.log 2>&1 &
          SERVER_PID=$!
          echo "FRESH_SERVER_PID=${SERVER_PID}" >> $GITHUB_ENV
          for i in $(seq 1 45); do
            if ! kill -0 "${SERVER_PID}" 2>/dev/null; then
              echo "Orbit server exited prematurely:"
              cat /tmp/orbit-fresh-db.log || true
              exit 1
            fi
            if curl -sf http://127.0.0.1:3000/api/healthz >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          if ! curl -sf http://127.0.0.1:3000/api/healthz || ! curl -sf http://127.0.0.1:3000/api/setup >/dev/null; then
            echo "Orbit server failed health/init check:"
            cat /tmp/orbit-fresh-db.log || true
            exit 1
          fi

      - name: Run Contract Tests
        run: pnpm test

      - name: Run Simulation E2E Tests
        run: pnpm test:e2e

      - name: Run E2E API Tests
        run: |
          node tests/fixtures/dev-fixtures.mjs --base http://127.0.0.1:3000 --out .fixtures.json
          node tests/e2e/rbac-api.mjs --fixtures .fixtures.json --base http://127.0.0.1:3000
          node tests/e2e/audit-api.mjs --fixtures .fixtures.json --base http://127.0.0.1:3000

      - name: Print Fresh DB Server Logs on Failure
        if: failure()
        run: cat /tmp/orbit-fresh-db.log || true

      - name: Stop Orbit Server
        if: always()
        run: |
          if [ -n "${FRESH_SERVER_PID:-}" ]; then
            kill -TERM -"${FRESH_SERVER_PID}" >/dev/null 2>&1 || kill "${FRESH_SERVER_PID}" >/dev/null 2>&1 || true
          fi

  # =========================================================================
  # 4. Stage: Critical UI E2E Subset (Playwright on Node 26)
  # =========================================================================
  ui-e2e:
    name: Critical UI E2E Subset (Playwright)
    needs: [build-and-verify]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orbit
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: ci_ephemeral_ui_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://orbit:ci_ephemeral_ui_pw@localhost:5432/orbit
      PORT: 3100
      HOSTNAME: localhost
      MOCK_MAIL: 'true'
      E2E_TRUSTED_AUTH: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      BOOTSTRAP_ADMIN_EMAIL: admin@orbit.local
      BOOTSTRAP_ADMIN_PASSWORD: ci_ephemeral_admin_pw
      BOOTSTRAP_ADMIN_FIRST_NAME: Orbit
      BOOTSTRAP_ADMIN_LAST_NAME: Admin
      ORBIT_DATA_DIR: ${{ github.workspace }}/data
      ORBIT_CUSTOM_DIR: ${{ github.workspace }}/data/custom
      UPLOAD_DIR: ${{ github.workspace }}/data/uploads

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-ms-playwright-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Prepare runtime data directories
        run: mkdir -p data/uploads data/custom

      - name: Ensure Chrome/Chromium is available for Playwright
        run: |
          if [ ! -x /usr/bin/google-chrome ] && [ ! -x /usr/bin/google-chrome-stable ] && [ ! -x /usr/bin/chromium ]; then
            pnpm exec playwright-core install --with-deps chromium
            CHROME_BIN="$(find "${HOME}/.cache/ms-playwright" -name chrome -type f 2>/dev/null | head -n1 || true)"
            if [ -z "${CHROME_BIN}" ]; then
              CHROME_BIN="$(find "${HOME}/.cache/ms-playwright" -name chrome-headless-shell -type f 2>/dev/null | head -n1 || true)"
            fi
            if [ -n "${CHROME_BIN}" ]; then
              sudo ln -sf "${CHROME_BIN}" /usr/bin/chromium
            fi
          fi

      - name: Download Prebuilt Artifacts
        uses: actions/download-artifact@v4
        with:
          name: orbit-prebuilt
          path: /tmp

      - name: Extract Prebuilt Artifacts & Start Orbit Server for UI E2E
        run: |
          tar -xf /tmp/orbit-build.tar
          mkdir -p .next/standalone/.next
          rm -rf .next/standalone/.next/static .next/standalone/public
          ln -sfn "${{ github.workspace }}/.next/static" .next/standalone/.next/static
          ln -sfn "${{ github.workspace }}/public" .next/standalone/public
          setsid pnpm start </dev/null > /tmp/orbit-ui-server.log 2>&1 &
          SERVER_PID=$!
          echo "UI_SERVER_PID=${SERVER_PID}" >> $GITHUB_ENV
          for i in $(seq 1 45); do
            if ! kill -0 "${SERVER_PID}" 2>/dev/null; then
              echo "Orbit server exited prematurely:"
              cat /tmp/orbit-ui-server.log || true
              exit 1
            fi
            if curl -sf http://localhost:3100/api/healthz >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          if ! curl -sf http://localhost:3100/api/healthz >/dev/null || ! curl -sf http://localhost:3100/api/setup >/dev/null || ! curl -sf http://localhost:3100/ >/dev/null; then
            echo "Orbit server failed readiness check:"
            cat /tmp/orbit-ui-server.log || true
            exit 1
          fi

      - name: Seed UI E2E Fixtures
        run: node tests/fixtures/dev-fixtures.mjs --base http://localhost:3100 --out .e2e-fixtures.json --no-totp-wait

      - name: Run Critical UI E2E Suites
        run: |
          pnpm e2e window-manager sse notifications interaction-perf lazy-loading --base http://localhost:3100 --fixtures .e2e-fixtures.json

      - name: Upload UI E2E Diagnostics on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-e2e-diagnostics
          path: |
            tests/e2e/shots/
            tests/e2e/.tmp/
            /tmp/orbit-ui-server.log
          if-no-files-found: ignore

      - name: Stop Orbit Server
        if: always()
        run: |
          if [ -n "${UI_SERVER_PID:-}" ]; then
            kill -TERM -"${UI_SERVER_PID}" >/dev/null 2>&1 || kill "${UI_SERVER_PID}" >/dev/null 2>&1 || true
          fi

  # =========================================================================
  # 5. Stage: Docker Image Build & GHCR Push (ONLY on Version Tag)
  # =========================================================================
  docker-publish:
    name: Build & Push Docker Image (GHCR)
    needs: [security-e2e, fresh-db, ui-e2e]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # 6. Stage: Release Packages & GitHub Release
  # =========================================================================
  create-release:
    name: Package Release & Publish GitHub Release
    needs: [build-and-verify, docker-publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Prebuilt Artifacts
        uses: actions/download-artifact@v4
        with:
          name: orbit-prebuilt
          path: /tmp

      - name: Extract Prebuilt Artifacts
        run: tar -xf /tmp/orbit-build.tar

      - name: Ensure zip & tar utilities
        run: which zip || (sudo apt-get update -y && sudo apt-get install -y zip)

      - name: Build Release Bundles (Docker & Standalone)
        run: node scripts/package-release.mjs ${{ github.ref_name }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cat <<'EOF' > /tmp/release-notes.md
          ## 🚀 Orbit Community OS ${{ github.ref_name }}

          This release provides both an official **Docker image (GHCR)** and **pre-compiled standalone distribution archives**.

          ---

          ### 🐳 1. Docker Deployment (Recommended)
          Download `orbit-os-${{ github.ref_name }}-docker.tar.gz` from the Assets below:
          ```bash
          tar -xzf orbit-os-${{ github.ref_name }}-docker.tar.gz
          cd orbit-os-${{ github.ref_name }}-docker
          make up
          ```
          * The stack runs securely bound to `127.0.0.1:3000`.
          * Point your host reverse proxy (e.g., Nginx) to `127.0.0.1:3000` with TLS termination, `proxy_buffering off;` (for SSE), and WebSocket upgrade headers (`Upgrade` / `Connection`).

          ---

          ### ⚡ 2. Baremetal / Direct Node.js Execution (Standalone Build)
          If deploying directly without Docker, download `orbit-os-${{ github.ref_name }}-standalone.tar.gz`:
          ```bash
          tar -xzf orbit-os-${{ github.ref_name }}-standalone.tar.gz
          cd orbit-os-${{ github.ref_name }}-standalone
          node server.js
          ```
          *(Requires Node.js 22+ and PostgreSQL. No pnpm or TypeScript compiler required on the production host).*
          EOF
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="${TAG_NAME}" -q .body >> /tmp/release-notes.md || true
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release edit "${TAG_NAME}" --title "Orbit Community OS ${TAG_NAME}" --notes-file /tmp/release-notes.md
          else
            gh release create "${TAG_NAME}" \
              --title "Orbit Community OS ${TAG_NAME}" \
              --notes-file /tmp/release-notes.md
          fi
          for f in dist-release/*.tar.gz dist-release/*.zip dist-release/*.sha256; do
            [ -e "$f" ] && gh release upload "${TAG_NAME}" "$f" --clobber
          done
