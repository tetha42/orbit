name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. Aşama: Kod Kalitesi, Güvenlik ve Testler (Her Push, PR ve Tag'de Koşar)
  # =========================================================================
  verify-and-test:
    name: Verify, Build & E2E Simulation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orbit
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'ci_ephemeral_test_pw' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://orbit:${{ secrets.POSTGRES_PASSWORD || 'ci_ephemeral_test_pw' }}@localhost:5432/orbit
      NODE_ENV: test
      PORT: 3000
      ORBIT_DATA_DIR: ${{ github.workspace }}/data
      ORBIT_CUSTOM_DIR: ${{ github.workspace }}/data/custom
      UPLOAD_DIR: ${{ github.workspace }}/data/uploads

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare runtime data directories
        run: mkdir -p data/uploads data/custom

      - name: Verify Codebase (TSC, ESLint, Manifests)
        run: pnpm verify

      - name: Security audit
        run: pnpm audit --prod --audit-level=high

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Security Regression & WAF Testing
        run: pnpm test:security

      - name: Production Build Verification
        run: pnpm build

  fresh-db:
    name: Fresh DB Migration & Contract Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orbit
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: ci_ephemeral_fresh_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://orbit:ci_ephemeral_fresh_pw@localhost:5432/orbit
      NODE_ENV: test
      PORT: 3000
      BASE_URL: http://127.0.0.1:3000
      BOOTSTRAP_ADMIN_EMAIL: admin@orbit.local
      BOOTSTRAP_ADMIN_PASSWORD: ci_ephemeral_admin_pw
      ORBIT_DATA_DIR: ${{ github.workspace }}/data
      ORBIT_CUSTOM_DIR: ${{ github.workspace }}/data/custom
      UPLOAD_DIR: ${{ github.workspace }}/data/uploads

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare runtime data directories
        run: mkdir -p data/uploads data/custom

      - name: Build Next.js App
        run: pnpm build

      - name: Start Orbit Server
        run: |
          pnpm start &
          for i in {1..30}; do
            curl -s http://127.0.0.1:3000/api/healthz && break || sleep 1
          done

      - name: Run Contract Tests
        run: pnpm test

      - name: Run E2E API Tests
        run: |
          node scripts/dev-fixtures.mjs --out .fixtures.json
          node tests/e2e/rbac-api.mjs --fixtures .fixtures.json --base http://127.0.0.1:3000
          node tests/e2e/audit-api.mjs --fixtures .fixtures.json --base http://127.0.0.1:3000

  # =========================================================================
  # 2. Aşama: Docker Image Derleme & GHCR Push (SADECE Tag Varsa ve Test Geçtiyse)
  # =========================================================================
  docker-publish:
    name: Build & Push Docker Image (GHCR)
    needs: [verify-and-test, fresh-db]
    # SADECE v* ile başlayan bir tag pushlandığında çalışır:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # 3. Aşama: Release Paketleri & GitHub Release (Docker Başarıyla Yüklendiyse)
  # =========================================================================
  create-release:
    name: Package Release & Publish GitHub Release
    needs: [docker-publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js standalone
        run: pnpm build

      - name: Install zip utility
        run: sudo apt-get update -y && sudo apt-get install -y zip tar

      - name: Build Release Bundles (Docker & Standalone)
        run: node scripts/package-release.mjs ${{ github.ref_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Orbit Community OS ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist-release/*.tar.gz
            dist-release/*.zip
            dist-release/*.sha256
          body: |
            ## 🚀 Orbit Community OS ${{ github.ref_name }}

            This release provides both an official **Docker image (GHCR)** and **pre-compiled standalone distribution archives**.

            ---

            ### 🐳 1. Docker Deployment (Recommended)
            Download `orbit-os-${{ github.ref_name }}-docker.tar.gz` from the Assets below:
            ```bash
            tar -xzf orbit-os-${{ github.ref_name }}-docker.tar.gz
            cd orbit-os-${{ github.ref_name }}-docker
            make up
            ```
            * The stack runs securely bound to `127.0.0.1:3000`.
            * Add these 3 lines to your host reverse proxy (Caddy):
              ```caddy
              orbit.example.com {
                  reverse_proxy 127.0.0.1:3000
              }
              ```
            * Or for Nginx, include `proxy_buffering off;` and WebSocket upgrades.

            ---

            ### ⚡ 2. Baremetal / Direct Node.js Execution (Standalone Build)
            If deploying directly without Docker, download `orbit-os-${{ github.ref_name }}-standalone.tar.gz`:
            ```bash
            tar -xzf orbit-os-${{ github.ref_name }}-standalone.tar.gz
            cd orbit-os-${{ github.ref_name }}-standalone
            node server.js
            ```
            *(Requires Node.js 20+ and PostgreSQL. No pnpm or TypeScript compiler required on the production host).*
