# PostgreSQL + Next.js Orbit Community OS stack.
#
#   docker compose -f infra/docker/docker-compose.yml up -d db      # database only
#   docker compose -f infra/docker/docker-compose.yml up -d         # database + app (localhost:3000)
#   docker compose -f infra/docker/docker-compose.yml logs -f
#   docker compose -f infra/docker/docker-compose.yml down          # stop, keep the volume
name: tetha42-orbit-prod

services:
  db:
    image: postgres:16-alpine
    container_name: orbit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orbit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-orbit}
      # NOTE: No default password. Supply POSTGRES_PASSWORD via .env or secret manager.
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    expose:
      - '5432'
    volumes:
      - orbit-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-orbit} -d ${POSTGRES_DB:-orbit}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    image: ${ORBIT_IMAGE:-ghcr.io/tetha42/orbit}:${ORBIT_TAG:-latest}
    container_name: orbit-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-orbit}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-orbit}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_FIRST_NAME: ${BOOTSTRAP_ADMIN_FIRST_NAME:-}
      BOOTSTRAP_ADMIN_LAST_NAME: ${BOOTSTRAP_ADMIN_LAST_NAME:-}
      TERMINAL_ENABLED: ${TERMINAL_ENABLED:-0}
      UPLOAD_DIR: /app/data/uploads
      ORBIT_DATA_DIR: /app/data
      ORBIT_CUSTOM_DIR: /app/data/custom
      PUBLIC_API_ALLOWED_ORIGINS: ${PUBLIC_API_ALLOWED_ORIGINS:-http://localhost:3000,http://orbit.local}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      SECURITY_GUARD_URL: ${SECURITY_GUARD_URL:-http://security-guard:8080}
      SECURITY_GUARD_TOKEN: ${SECURITY_GUARD_TOKEN:-}
      WEBRTC_TURN_URL: ${WEBRTC_TURN_URL:-}
      WEBRTC_TURN_SECRET: ${WEBRTC_TURN_SECRET:-}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:security@orbit.local}
    # Host port mapping is disabled by default for Coolify and reverse proxies
    # to prevent port allocation conflicts (Bind for :::3000 failed) during rolling deploys.
    # Coolify routes directly to the internal container port via 'expose'.
    # ports:
    #   - '${PORT:-3000}:3000'
    expose:
      - '3000'
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /app/.next/cache:rw,noexec,nosuid,size=128m
    volumes:
      - orbit-data:/app/data
      - orbit-uploads:/app/data/uploads
      # Branding, custom wallpapers and other operator customisations. A named
      # volume like pg_data, so a container rebuild never loses them.
      - orbit-custom:/app/data/custom
      - orbit-tmp:/tmp
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3000/api/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  security-guard:
    build:
      context: ../../
      dockerfile: services/security-guard/Dockerfile
    image: ${ORBIT_SECURITY_IMAGE:-orbit-security-guard}:${ORBIT_TAG:-latest}
    container_name: orbit-security-guard
    restart: unless-stopped
    environment:
      PORT: 8080
      ORBIT_ROOT: /app
      ORBIT_FIM_BASELINE_DIR: /app/state
      SECURITY_GUARD_TOKEN: ${SECURITY_GUARD_TOKEN:-}
    expose:
      - '8080'
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ../../src:/app/src:ro
      - ../../scripts:/app/scripts:ro
      - ../../tools:/app/tools:ro
      - ../../public:/app/public:ro
      - ../../package.json:/app/package.json:ro
      - ../../next.config.mjs:/app/next.config.mjs:ro
      - ../../tsconfig.json:/app/tsconfig.json:ro
      - orbit-data:/app/data:ro
      - orbit-uploads:/app/data/uploads:ro
      - orbit-custom:/app/data/custom:ro
      - orbit-tmp:/tmp:ro
      - orbit-guard-state:/app/state
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8080/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: orbit-coturn
    profiles: ['webrtc-turn']
    restart: unless-stopped
    network_mode: host
    command:
      - --listening-port=3478
      - --use-auth-secret
      - --static-auth-secret=${WEBRTC_TURN_SECRET:-change_me_turn_secret}
      - --realm=${WEBRTC_TURN_REALM:-orbit.local}
      - --no-tlsv1
      - --no-tlsv1_1

volumes:
  orbit-pgdata:
  orbit-data:
  orbit-uploads:
  orbit-custom:
  orbit-tmp:
  orbit-guard-state:
